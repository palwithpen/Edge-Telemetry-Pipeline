listener 1883

# Local dev only — no auth configured. Would need real credentials before this went
# anywhere near production.
allow_anonymous true

# Default is 1000. Raised after a load test with a 10,000-message burst stalled partway
# through with no error anywhere in the app — Mosquitto was silently dropping messages past
# this per-client queue limit once the subscriber fell behind, even briefly. See the
# README's Load testing section for the full diagnosis.
max_queued_messages 20000
